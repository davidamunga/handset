name: release

# Keeps a "Version packages" pull request up to date from the changesets on main. Merging that pull
# request bumps the version and CHANGELOG.md; the next run of this workflow tags the release (v0.1.0)
# and creates the GitHub release. See docs/runbooks/release.md.

on:
  push:
    branches: [main]
  # Dry run: builds the release files and keeps them as a workflow artifact, publishes nothing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: version or tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run tag
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build and attach binaries (macOS)
    needs: release
    outputs:
      version: ${{ steps.release-files.outputs.version }}
      sha256: ${{ steps.release-files.outputs.sha256 }}
    # Tags made with the default token do not start other workflows, so the binaries are built here,
    # in the same run that tagged the release.
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: without them the build is ad-hoc signed. See docs/runbooks/release.md.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Write the notarisation key
        if: env.NOTARY_KEY_P8 != ''
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - id: release-files
        run: |
          scripts/package-release.sh
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "dist/release/Handset-$version-macos.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "v$version" dist/release/* --clobber
          # 0.x releases are pre-releases
          case "$version" in 0.*) gh release edit "v$version" --prerelease --latest=false ;; esac
      - name: Keep the files as an artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: handset-release-files
          path: dist/release/*

  homebrew:
    name: update the Homebrew cask
    needs: [release, build]
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Bump the cask in davidamunga/homebrew-tap
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/davidamunga/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/handset.rb
          if git diff --quiet; then echo "cask already at ${VERSION}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "handset ${VERSION}"
          git push origin HEAD:main
      - name: No tap token
        if: env.TAP_GITHUB_TOKEN == ''
        run: echo "::notice::TAP_GITHUB_TOKEN is not set, so the Homebrew cask was not updated. See docs/runbooks/release.md."
