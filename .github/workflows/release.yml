name: release

# Publishes a release. It only runs when you start it by hand: Actions > release > Run workflow, or
# `gh workflow run release.yml`. It releases the version in package.json on main (the one a merged
# "Version packages" pull request set), or, for a patch to an older line, on the branch release/<version>
# of that very version, after checking that it has not been released yet and that CHANGELOG.md has a
# section for it. It builds the files (see build-release-files.yml), tags vX.Y.Z, keeps the branch
# release/X.Y.Z at the tagged commit, creates the GitHub release and, from main only, bumps the Homebrew
# cask and the Scoop manifest.
# To rehearse without publishing anything, run `release-dry-run` instead. See docs/runbooks/release.md.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/release-branches.sh check-ref "$GITHUB_REF" "$version" || { echo "::error::Run the release from main, or from release/$version"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Merge a version pull request first."; exit 1
          fi
          grep -q "^## $version\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          if ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "::warning::Changesets are pending: they are not part of v$version."
          fi

  build:
    name: build the files
    needs: prepare
    uses: ./.github/workflows/build-release-files.yml
    secrets: inherit

  publish:
    name: tag and publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files*
          merge-multiple: true
          path: release-files
      - name: Create the tag and the GitHub release
        run: |
          awk -v v="$VERSION" '$0 == "## " v { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          printf '\n**Windows:** `Handset-%s-windows.zip` is not code-signed yet. SmartScreen warns on first run (More info, Run anyway), and a PC with Smart App Control on blocks unsigned apps entirely. Install `adb` (and `ffmpeg` for recording) and put them on `PATH`, or next to `handset.exe`.\n' "$VERSION" >> notes.md
          # only a release from main is "latest": a patch to an older line must not take that place
          latest=--latest=false
          [ "$GITHUB_REF" = "refs/heads/main" ] && latest=--latest
          gh release create "v$VERSION" release-files/* \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md "$latest"
      - name: Keep a branch for this release
        run: |
          # release/X.Y.Z is the line that produced vX.Y.Z. A patch released from its own branch has it already.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/$VERSION" >/dev/null 2>&1; then
            echo "release/$VERSION already exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/release/$VERSION" -f sha="$GITHUB_SHA" >/dev/null
            echo "created release/$VERSION at $GITHUB_SHA"
          fi

  scoop:
    name: update the Scoop manifest
    needs: [prepare, build, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point bucket/handset.json at the new release
        run: |
          HASH=$(gh release download "v${VERSION}" --pattern SHA256SUMS-windows --output - | awk '/windows\.zip/ { print $1 }')
          test -n "$HASH"
          jq --arg v "$VERSION" --arg h "$HASH" '
            .version = $v
            | .hash = $h
            | .url = "https://github.com/davidamunga/handset/releases/download/v\($v)/Handset-\($v)-windows.zip"
            | .extract_dir = "Handset-\($v)"' bucket/handset.json > bucket/handset.json.new
          mv bucket/handset.json.new bucket/handset.json
          if git diff --quiet; then echo "manifest already at ${VERSION}"; exit 0; fi
          # main only takes changes through a pull request, which the workflow's token may open
          BRANCH="chore/scoop-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): update the Scoop manifest to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): update the Scoop manifest to ${VERSION}" \
            --body "Points bucket/handset.json at the ${VERSION} Windows zip. Opened by the release workflow; Scoop users get ${VERSION} once this is merged."

  homebrew:
    name: update the Homebrew cask
    needs: [prepare, build, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Bump the cask in davidamunga/homebrew-tap
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/davidamunga/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" Casks/handset.rb
          if git diff --quiet; then echo "cask already at ${VERSION}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "handset ${VERSION}"
          git push origin HEAD:main
      - name: No tap token
        if: env.TAP_GITHUB_TOKEN == ''
        run: echo "::notice::TAP_GITHUB_TOKEN is not set, so the Homebrew cask was not updated. See docs/runbooks/release.md."
