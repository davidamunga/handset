[package]
name = "handset"
version = "0.9.1"
edition = "2024"
rust-version = "1.91"
description = "Mirror and control an Android phone inside a realistic device frame"
license = "Apache-2.0"
repository = "https://github.com/davidamunga/handset"
publish = false

[dependencies]
ab_glyph = "0.2"
bytemuck = "1.25.2"
cpal = "0.18.2"
ed25519-dalek = "2"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
mdns-sd = "0.21.6"
openh264 = "0.9.9"
png = "0.18.1"
pollster = "1.0.1"
qrcode = { version = "0.14", default-features = false }
rfd = "0.15"
sha2 = "0.10"
wgpu = "30.0.1"
winit = "0.30.13"


[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = "0.21.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureAudioDataOutput", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2-core-audio-types", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer"] }
objc2-core-media-io = { version = "0.3", default-features = false, features = ["std", "CMIOHardwareObject", "CMIOHardwareSystem"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSRunLoop", "NSString", "NSValue"] }
