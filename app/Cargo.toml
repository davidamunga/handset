[package]
name = "handset"
version = "0.6.0"
edition = "2024"
rust-version = "1.91"
description = "Mirror and control an Android phone inside a realistic device frame"
license = "Apache-2.0"
repository = "https://github.com/davidamunga/handset"
publish = false

[dependencies]
ab_glyph = "0.2"
bytemuck = "1.25.2"
cpal = "0.18.2"
ed25519-dalek = "2"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
muda = "0.21.2"
openh264 = "0.9.9"
png = "0.18.1"
pollster = "1.0.1"
qrcode = { version = "0.14", default-features = false }
rfd = "0.15"
sha2 = "0.10"
wgpu = "30.0.1"
winit = "0.30.13"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
