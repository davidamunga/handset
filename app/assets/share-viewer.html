<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handset Share</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #0e0e10; color: #e6e6e8; font: 15px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  video { max-width: 100vw; max-height: 100vh; background: #000; border-radius: 14px; display: none; outline: none; }
  video.control { touch-action: none; cursor: pointer; max-height: calc(100vh - 64px); }
  #keys { position: fixed; bottom: 12px; left: 0; right: 0; display: none; justify-content: center; gap: 8px; }
  #keys button { font: inherit; color: inherit; background: #26262b; border: 1px solid #3a3a42; border-radius: 10px; padding: 8px 16px; }
  #keys button:active { background: #3a3a42; }
  #status { position: fixed; inset: auto 0 24px 0; text-align: center; color: #9a9aa2; padding: 0 16px; }
</style>
<video id="v" autoplay muted playsinline></video>
<div id="keys">
  <button data-key="back">Back</button><button data-key="home">Home</button><button data-key="recents">Recents</button>
  <button data-key="rotate">Rotate</button>
</div>
<div id="status">Asking the host to let you in…</div>
<script>
const status = document.getElementById('status');
const video = document.getElementById('v');
const say = text => { status.textContent = text; status.style.display = text ? '' : 'none'; };
// The host says "control" over the data channel when it lets this viewer touch the phone.
function enableControl(dc) {
  video.classList.add('control');
  video.tabIndex = 0;
  document.getElementById('keys').style.display = 'flex';
  const send = text => dc.readyState === 'open' && dc.send(text);
  const at = e => {
    const r = video.getBoundingClientRect();
    return ((e.clientX - r.left) / r.width).toFixed(4) + ',' + ((e.clientY - r.top) / r.height).toFixed(4);
  };
  let pressed = null;
  video.addEventListener('pointerdown', e => {
    if (!e.isPrimary || pressed !== null) return;
    pressed = e.pointerId;
    video.setPointerCapture(e.pointerId);
    video.focus();
    send('d,' + at(e));
  });
  video.addEventListener('pointermove', e => { if (e.pointerId === pressed) send('m,' + at(e)); });
  const up = e => { if (e.pointerId === pressed) { pressed = null; send('u,' + at(e)); } };
  video.addEventListener('pointerup', up);
  video.addEventListener('pointercancel', up);
  video.addEventListener('wheel', e => {
    e.preventDefault();
    // a wheel notch is about 100 pixels; the phone scrolls the other way
    send('s,' + at(e) + ',' + (-e.deltaX / 100).toFixed(2) + ',' + (-e.deltaY / 100).toFixed(2));
  }, { passive: false });
  video.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Backspace') send('k,del');
    else if (e.key === 'Enter') send('k,enter');
    else if (e.key.length === 1) send('t,' + e.key);
    else return;
    e.preventDefault();
  });
  document.getElementById('keys').addEventListener('click', e => {
    const key = e.target.dataset && e.target.dataset.key;
    if (key) send(key === 'rotate' ? 'r' : 'k,' + key);
  });
}

(async () => {
  const pc = new RTCPeerConnection();
  pc.addTransceiver('video', { direction: 'recvonly' });
  // always opened: it is how the host says whether this viewer may control, and it keeps the offer the same
  const dc = pc.createDataChannel('control');
  dc.onmessage = e => { if (e.data === 'control') enableControl(dc); };
  pc.ontrack = e => {
    video.srcObject = e.streams[0] || new MediaStream([e.track]);
    video.style.display = 'block';
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') say('');
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected' || pc.connectionState === 'closed') {
      say('The connection ended. Reload to ask again.');
    }
  };
  await pc.setLocalDescription(await pc.createOffer());
  // the host sends its connectivity checks to the addresses in the offer, so wait for them
  await new Promise(done => {
    if (pc.iceGatheringState === 'complete') return done();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && done();
    setTimeout(done, 3000);
  });
  const r = await fetch('/offer', { method: 'POST', body: pc.localDescription.sdp });
  if (r.status === 403) return say('The host did not let you in.');
  if (r.status === 429 || r.status === 503) return say('The host is busy. Try again in a moment.');
  if (!r.ok) return say('Could not connect: ' + (await r.text()));
  say('Connecting…');
  await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
})().catch(e => say('Could not connect: ' + e));
</script>
